# Constroi o app e publica na branch gh-pages, que o GitHub Pages serve em:
#   https://davimec201-cmd.github.io/Leti/
#
# Roda sozinho a cada push nesta branch — entao, para mudar um texto, basta
# editar src/config/content.js, dar commit e esperar ~1 minuto.
name: Publicar no GitHub Pages

on:
  push:
    branches: [claude/davi-apuros-mini-app-3kp19d]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Mandar o build para a branch gh-pages
        run: |
          cp -r dist /tmp/site
          touch /tmp/site/.nojekyll
          cd /tmp/site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Site publicado (build de ${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
